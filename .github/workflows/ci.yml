name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-latest because the WAL's durability path is Darwin-specific
    # (F_FULLFSYNC, not plain fsync) — CI needs to exercise the real thing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
