name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-latest because the WAL's durability path is Darwin-specific
    # (F_FULLFSYNC, not plain fsync) — CI needs to exercise the real thing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint protobuf schema
        run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- internal/genproto

      - run: go build ./...
      - run: go vet ./...
      # -race is not optional here: this is a concurrency-heavy system, and the
      # bugs it catches are exactly the ones that pass a casual test run.
      - run: go test -race ./...

      # Installed with `go install` rather than golangci-lint-action, so the
      # linter is built by the same toolchain as the module it inspects.
      # golangci-lint refuses to run when it was built with an older Go than
      # the target's `go` directive, which is exactly what the prebuilt binaries
      # hit here. Pinned so a new release cannot change the result of a rerun.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          "$(go env GOPATH)/bin/golangci-lint" run ./...
